<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAITRI 2026 | QR Check-in</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#12352f;background:#f4f8f7}*{box-sizing:border-box}
body{max-width:500px;margin:0 auto;padding:18px}h1{font-size:24px;margin:8px 0 4px}
p{margin:6px 0 16px;color:#526b65}.panel{background:white;padding:16px;border-radius:16px;box-shadow:0 1px 8px #0001}
#reader{width:100%;overflow:hidden;border-radius:12px}.status{padding:14px;border-radius:12px;margin:14px 0;min-height:55px;background:#edf2f1;white-space:pre-line;font-weight:600}
.good{background:#def5e7;color:#12643c}.bad{background:#fff0db;color:#7b4400}.error{background:#ffe6e6;color:#911d23}
button{background:#125642;color:#fff;border:0;border-radius:10px;padding:16px;font-size:17px;font-weight:700;width:100%;margin:7px 0;cursor:pointer}
button:disabled{opacity:.55}.small{font-size:13px;color:#62716d}#next{display:none}
</style>
</head>
<body>
<div class="panel">
<h1>MAITRI 2026 Check-in</h1>
<p>Scan a participant's badge. Attendance is saved automatically.</p>
<div id="reader"></div>
<div id="status" class="status" role="status" aria-live="polite">Starting camera...</div>
<button id="next" type="button">Scan next badge</button>
<p class="small">Requires camera permission and internet. Do not open inside a messaging app browser.</p>
</div>
<script>
'use strict';
// IMPORTANT: Replace only this URL if your deployment changes.
const API_URL='https://script.google.com/macros/s/AKfycbwIOvoNo5u6DFIixavXsVOaNaPPQ0bmsVNrh7gpveVwrscjE37KTOAGbAP4MkAvYM037w/exec';
const statusEl=document.getElementById('status');
const nextBtn=document.getElementById('next');
let scanner=null,busy=false,requestSeq=0;
function show(msg,kind=''){statusEl.textContent=msg;statusEl.className='status '+kind;}
function lookup(token){
  return new Promise((resolve,reject)=>{
    const cb='maitriCb'+(++requestSeq);
    const el=document.createElement('script');
    let finished=false;
    const timeout=setTimeout(()=>end(new Error('Verification timed out')),12000);
    function end(error,value){if(finished)return;finished=true;clearTimeout(timeout);el.remove();delete window[cb];error?reject(error):resolve(value);}
    window[cb]=v=>end(null,v);
    el.onerror=()=>end(new Error('Cannot contact the attendance service'));
    el.src=API_URL+'?callback='+encodeURIComponent(cb)+'&token='+encodeURIComponent(token)+'&_='+Date.now();
    document.head.appendChild(el);
  });
}
function sleep(ms){return new Promise(resolve=>setTimeout(resolve,ms));}
async function awaitSaved(token){
  for(let i=0;i<8;i++){
    await sleep(i===0?400:800);
    const r=await lookup(token);
    if(r.ok&&r.code==='ATTENDED')return r;
    if(!r.ok)throw new Error(r.message||'Could not verify attendance');
  }
  throw new Error('Attendance not confirmed. Check Google Sheets before scanning again.');
}
async function scanned(token){
  if(busy)return;
  busy=true;
  try{if(scanner)await scanner.pause(true);}catch(e){}
  nextBtn.style.display='none';
  try{
    show('Checking badge...');
    const before=await lookup(token);
    if(!before.ok){show(before.message||'Invalid badge','error');return;}
    if(before.code==='ATTENDED'){show('Already checked in\n'+before.name+'\n'+before.id,'bad');return;}
    show('Recording attendance...');
    // No CORS headers are needed for the write. The opaque response itself is NOT proof of success.
    // We separately verify status using the read-only JSONP endpoint.
    await fetch(API_URL,{method:'POST',mode:'no-cors',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token})});
    const after=await awaitSaved(token);
    show('✓ Attendance recorded\n'+after.name+'\n'+after.id,'good');
  }catch(err){show('Could not confirm check-in: '+(err.message||err)+'\nCheck Google Sheets.','error');}
  finally{nextBtn.style.display='block';}
}
async function restart(){
  busy=false;nextBtn.style.display='none';show('Ready to scan');
  if(scanner){try{await scanner.resume();return;}catch(err){}
    try{await scanner.clear();}catch(err){}
  }
  start();
}
async function start(){
  if(!window.Html5QrcodeScanner){show('QR scanning library did not load. Check internet.','error');return;}
  try{
    scanner=new Html5QrcodeScanner('reader',{fps:10,qrbox:{width:220,height:220},rememberLastUsedCamera:true},false);
    scanner.render(scanned,()=>{});
    show('Allow camera access, then point at the badge QR code');
  }catch(err){show('Camera error: '+(err.message||err),'error');}
}
nextBtn.addEventListener('click',restart);
start();
</script>
</body>
</html>
